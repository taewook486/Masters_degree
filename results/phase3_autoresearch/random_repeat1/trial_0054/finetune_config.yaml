evaluation:
  eval_strategy: epoch
  metric_for_best_model: eval_accuracy
lora:
  alpha: 32
  bias: none
  dropout: 0.05
  rank: 16
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  task_type: CAUSAL_LM
quantization:
  bnb_4bit_compute_dtype: float16
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  load_in_4bit: true
seed: 42
training:
  bf16: false
  fp16: true
  gradient_accumulation_steps: 8
  gradient_checkpointing: true
  learning_rate: 0.000419
  logging_steps: 10
  lr_scheduler_type: cosine
  max_seq_length: 2048
  max_steps: 200
  optim: paged_adamw_8bit
  per_device_train_batch_size: 4
  save_strategy: epoch
  warmup_ratio: 0.0652
  weight_decay: 0.023
