# Base QLoRA Configuration for Medical VQA Fine-Tuning
# Hardware target: RTX 5060 Ti 16GB VRAM

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_compute_dtype: float16
  bnb_4bit_use_double_quant: true

lora:
  # Ablation A/B/C(39조건, 3시드) 결과로 확정된 최적 조합: ratio=1.0(기본 full data,
  # 별도 설정 불필요), rank=64, target=full(all-linear). 단조 증가 패턴 확인, 비용 증가는 미미.
  rank: 64
  alpha: 128
  dropout: 0.05
  target_modules:
    - full
  bias: none
  task_type: CAUSAL_LM

training:
  learning_rate: 2.0e-4
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  num_train_epochs: 3
  # QLoRA 고정 스텝 예산(2-3B 소형 모델은 빨리 수렴). full 3에폭(pathvqa 7370스텝≈26h/조건)은
  # 비현실적이라 max_steps로 상한. 500스텝×8(grad_accum)=4000샘플 학습. ~1.8h/조건.
  max_steps: 500
  max_seq_length: 2048
  warmup_ratio: 0.03
  weight_decay: 0.01
  lr_scheduler_type: cosine
  optim: paged_adamw_8bit
  gradient_checkpointing: true
  fp16: true
  bf16: false
  logging_steps: 10
  save_strategy: epoch

evaluation:
  eval_strategy: epoch
  metric_for_best_model: eval_accuracy

seed: 42
